[project]
name = "ai-teaching-assistant"
version = "0.1.0"
description = "BayanAI Educator Copilot, an AI teaching assistant built with Pydantic AI: RAG over course materials, lesson plans, quizzes, rubrics, adaptive step-by-step explanations, conversation memory, and resource recommendations."
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=1.0.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
teaching-assistant = "teaching_assistant.cli:main"
teaching-assistant-web = "teaching_assistant.web:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["teaching_assistant*"]
